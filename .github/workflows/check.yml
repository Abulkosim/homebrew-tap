name: Check casks

# On a Mac with the latest Homebrew: install Tonearm the way the README says, check it,
# uninstall it with --zap, then run brew style and brew audit on every cask. Each step
# runs even when an earlier one failed, so one run shows every problem.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Install, style and audit
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update Homebrew and use this checkout as abulkosim/tap
        run: |
          brew update --quiet
          brew --version
          tap="$(brew --repository)/Library/Taps/abulkosim/homebrew-tap"
          rm -rf "$tap"
          mkdir -p "$(dirname "$tap")"
          cp -R "$GITHUB_WORKSPACE" "$tap"
      - name: Install Tonearm as the README says
        run: |
          brew install --cask abulkosim/tap/tonearm
          test -d /Applications/Tonearm.app
          if xattr -p com.apple.quarantine /Applications/Tonearm.app 2> /dev/null; then
            echo "::error::the cask left the quarantine flag on Tonearm.app"
            exit 1
          fi
          codesign --verify --deep --strict /Applications/Tonearm.app
          echo "Installed Tonearm $(defaults read /Applications/Tonearm.app/Contents/Info.plist CFBundleShortVersionString)"
      - name: Uninstall with --zap
        if: ${{ !cancelled() }}
        run: |
          history_dir="$HOME/Library/Application Support/Tonearm"
          mkdir -p "$history_dir"
          touch "$history_dir/history.sqlite"
          brew uninstall --zap --cask tonearm
          test ! -e /Applications/Tonearm.app
          if [ -e "$history_dir" ]; then
            echo "::error::--zap left the listening history in $history_dir"
            exit 1
          fi
      - name: brew style
        if: ${{ !cancelled() }}
        run: |
          brew trust abulkosim/tap
          brew style abulkosim/tap
      - name: brew audit
        if: ${{ !cancelled() }}
        run: |
          for cask in Casks/*.rb; do
            brew audit --cask --strict --online "abulkosim/tap/$(basename "$cask" .rb)"
          done
